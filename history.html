<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>History · Reading Group</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤭</text></svg>">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="wide" data-page="history" data-title="Everything we've read">
  <main class="page">
    <div id="content" hidden>
      <div class="toolbar">
        <input type="search" id="q" placeholder="Search title, author, publisher…" aria-label="Search">
        <select id="selector" aria-label="Selected by"><option value="">Selected by: anyone</option></select>
        <span class="count" id="count"></span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th data-key="title"><span class="ico">Aa</span>Title</th>
              <th data-key="authors"><span class="ico">≡</span>Author(s)</th>
              <th data-key="published_on"><span class="ico">📅</span>Published</th>
              <th data-key="publisher"><span class="ico">≡</span>Publisher</th>
              <th data-key="meeting_date" class="sorted"><span class="ico">📅</span>Date we read</th>
              <th data-key="selected_by"><span class="ico">👤</span>Selected by</th>
              <th data-key="url"><span class="ico">🔗</span>Link</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.57.4/dist/umd/supabase.js"></script>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
  <script src="js/history.js"></script>
</body>
</html>
