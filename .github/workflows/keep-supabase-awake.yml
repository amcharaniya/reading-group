# Supabase's free plan pauses a project after ~7 days without activity, and we only meet every two weeks.
# This makes a small database read every 3 days so the project stays awake. The key is the public
# publishable key already in js/config.js; row-level security means the read returns nothing.
name: Keep Supabase awake

on:
  schedule:
    - cron: "17 14 */3 * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 \
            "https://qntpbraaxwexfqddblbx.supabase.co/rest/v1/readings?select=id&limit=1" \
            -H "apikey: sb_publishable_DDWlrT6eg9tYDzsFBtujtw_mdX0WXb_")
          echo "Supabase responded with HTTP $code"
          test "$code" = 200
